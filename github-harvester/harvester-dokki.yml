name: Cloud Quota Harvester - Dokki

on:
  # BACKUP TRIGGER: GitHub Actions cron (every 3 hours)
  # Runs at: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
  schedule:
    - cron: '0 */3 * * *'
  
  # PRIMARY TRIGGER: External webhook (every 2 hours)
  # Runs at: 00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 UTC
  repository_dispatch:
    types: [harvest_dokki]
  
  # MANUAL TRIGGER: For testing
  workflow_dispatch:

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 119
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('github-harvester/package.json') }}
      - name: Install dependencies
        run: |
          cd github-harvester
          npm install --prefer-offline --no-audit
      - name: Run Dokki harvester
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          DOKKI_USERNAME:      ${{ secrets.DOKKI_USERNAME }}
          DOKKI_PASSWORD:      ${{ secrets.DOKKI_PASSWORD }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID:   ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          cd github-harvester
          node harvester-dokki.js
