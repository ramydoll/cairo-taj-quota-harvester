name: Antibotz Harvester - Line 104

on:
  schedule:
    # GitHub Actions cron (backup if webhook fails)
    # Every 90 minutes = :00, :30 of alternating hours
    - cron: '0 0-22/3 * * *'    # 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00
    - cron: '30 1-23/3 * * *'   # 01:30, 04:30, 07:30, 10:30, 13:30, 16:30, 19:30, 22:30

  # PRIMARY TRIGGER: External webhook (100% reliable timing)
  # Triggered by cron-job.org every 90 minutes exactly
  repository_dispatch:
    types: [antibotz_line104]

  workflow_dispatch:

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('github-harvester/package.json') }}

      - name: Install dependencies
        run: |
          cd github-harvester
          npm install --prefer-offline --no-audit

      - name: Run Antibotz harvester — Line 104
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          WE_USERNAME:         ${{ secrets.WE_USERNAME }}
          WE_PASSWORD:         ${{ secrets.WE_PASSWORD }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID:   ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          cd github-harvester
          node antibotz-104.js
