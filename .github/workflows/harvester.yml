name: Cloud Quota Harvester - Line 104

on:
  schedule:
    # Line 104: Runs every 90 minutes staggered pattern
    # 00:05, 01:35, 03:05, 04:35, 06:05, 07:35, 09:05, 10:35...
    # = 16 runs per day instead of 12
    - cron: '5 */2 * * *'      # :05 of even hours (00:05, 02:05, 04:05...)
    - cron: '35 1-23/2 * * *'  # :35 of odd hours (01:35, 03:35, 05:35...)
  workflow_dispatch:

env:
  # Suppress Node deprecation warnings
  NODE_OPTIONS: --no-deprecation

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('github-harvester/package.json') }}
      - name: Install dependencies
        run: |
          cd github-harvester
          npm install --prefer-offline --no-audit
      - name: Run harvester
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          WE_USERNAME:         ${{ secrets.WE_USERNAME }}
          WE_PASSWORD:         ${{ secrets.WE_PASSWORD }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID:   ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          cd github-harvester
          node harvester.js
