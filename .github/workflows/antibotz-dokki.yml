name: Antibotz Harvester - Dokki 094

on:
  schedule:
    # GitHub Actions cron (backup if webhook fails)
    # Every 90 minutes, offset 10 min from Line 104 to avoid runner competition
    - cron: '10 0-22/3 * * *'   # 00:10, 03:10, 06:10, 09:10, 12:10, 15:10, 18:10, 21:10
    - cron: '40 1-23/3 * * *'   # 01:40, 04:40, 07:40, 10:40, 13:40, 16:40, 19:40, 22:40

  # PRIMARY TRIGGER: External webhook (100% reliable timing)
  # Triggered by cron-job.org every 90 minutes exactly
  repository_dispatch:
    types: [antibotz_dokki]

  workflow_dispatch:

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('github-harvester/package.json') }}

      - name: Install dependencies
        run: |
          cd github-harvester
          npm install --prefer-offline --no-audit

      - name: Run Antibotz harvester — Dokki 094
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          DOKKI_USERNAME:      ${{ secrets.DOKKI_USERNAME }}
          DOKKI_PASSWORD:      ${{ secrets.DOKKI_PASSWORD }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID:   ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          cd github-harvester
          node antibotz-dokki.js
