name: Cloud Quota Harvester - Dokki

on:
  # GitHub Actions cron DISABLED - using external webhook only
  # (uncomment lines below if webhook service fails)
  # schedule:
  #   - cron: '20 */2 * * *'
  #   - cron: '50 1-23/2 * * *'
  
  # PRIMARY TRIGGER: External webhook (100% reliable timing)
  repository_dispatch:
    types: [harvest_dokki]
  
  workflow_dispatch:

env:
  NODE_OPTIONS: --no-deprecation

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          # CRITICAL: Always use 'stable' to match production fingerprint
          # Using old versions (e.g. 119) triggers WE's anti-bot detection
          chrome-version: stable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('github-harvester/package.json') }}
      - name: Install Xvfb (virtual display for non-headless Chrome)
        run: sudo apt-get install -y xvfb

      - name: Start Xvfb virtual display
        run: |
          Xvfb :99 -screen 0 1366x768x24 -ac +extension GLX +render -noreset &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2
          echo "Xvfb started on display :99"

      - name: Install dependencies
        run: |
          cd github-harvester
          npm install --prefer-offline --no-audit
      - name: Run Dokki harvester
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          DOKKI_USERNAME:      ${{ secrets.DOKKI_USERNAME }}
          DOKKI_PASSWORD:      ${{ secrets.DOKKI_PASSWORD }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID:   ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          cd github-harvester
          node harvester-dokki.js
