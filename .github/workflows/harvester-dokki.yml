name: Cloud Quota Harvester - Dokki

on:
  schedule:
    # GitHub Actions cron (backup if webhook fails)
    # 00:20, 01:50, 03:20, 04:50, 06:20, 07:50...
    - cron: '20 */2 * * *'      # :20 of even hours
    - cron: '50 1-23/2 * * *'   # :50 of odd hours
  
  # PRIMARY TRIGGER: External webhook (100% reliable timing)
  # Triggered by cron-job.org every 90 minutes exactly
  repository_dispatch:
    types: [harvest_dokki]
  
  # Manual trigger
  workflow_dispatch:

env:
  # Suppress Node deprecation warnings
  NODE_OPTIONS: --no-deprecation

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 119
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('github-harvester/package.json') }}
      - name: Install dependencies
        run: |
          cd github-harvester
          npm install --prefer-offline --no-audit
      - name: Run Dokki harvester
        env:
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          DOKKI_USERNAME:      ${{ secrets.DOKKI_USERNAME }}
          DOKKI_PASSWORD:      ${{ secrets.DOKKI_PASSWORD }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID:   ${{ secrets.TELEGRAM_GROUP_ID }}
        run: |
          cd github-harvester
          node harvester-dokki.js
